name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# This repo builds two separate deployables from one checkout --
# backend/ jobs use defaults.run.working-directory: backend, portal/
# jobs use actions/checkout + explicit working-directory (Next.js's
# own setup-node action wants to run from the portal/ directory
# directly for its npm cache key, so it's simpler not to rely on a
# job-level default there).

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install 'poetry==2.1.4'
          poetry install --with dev

      - name: Run unit tests
        run: poetry run python -m unittest discover -s services/control_plane/tests -t .

  docker:
    name: Backend Docker build + smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t control-plane:ci .

      - name: Run container
        run: docker run -d --name control-plane-ci -p 8080:8080 control-plane:ci

      - name: Wait for /healthz
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/healthz; then
              echo "control-plane is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "control-plane did not become healthy in time"
          exit 1

      - name: Container logs (always, for debugging)
        if: always()
        run: docker logs control-plane-ci

      - name: Stop container
        if: always()
        run: docker rm -f control-plane-ci

  # Plan section 35.9 (P2 production hardening) -- same reasoning and
  # the same actions:read live-verified fix as every other Python repo
  # in this platform's copy of this job: NOT in deploy-dev's `needs:`,
  # findings land in the Security tab.
  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3

  pip-audit:
    name: Dependency scan (pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install 'poetry==2.1.4'
          poetry self add poetry-plugin-export
          poetry install --with dev
      - name: Export requirements from poetry.lock
        run: poetry export --with dev -f requirements.txt -o requirements-audit.txt --without-hashes
      - name: pip-audit
        run: pip install pip-audit && pip-audit -r requirements-audit.txt --desc

  trivy:
    name: Backend container scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        working-directory: backend
        run: docker build -t control-plane:trivy-scan .
      # No `defaults.run.working-directory` on this job -- it only
      # applies to `run:` shell steps, not to a `uses:` action's own
      # input interpretation. trivy-action's `output:` and
      # upload-sarif's `sarif_file:` below are both explicit,
      # repo-root-relative paths instead, so they agree regardless
      # (live-caught: output: trivy-results.sarif alone wrote to repo
      # root even with a job-level backend/ default set, and
      # upload-sarif's backend/-prefixed sarif_file then couldn't find
      # it there).
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: control-plane:trivy-scan
          format: sarif
          output: backend/trivy-results.sarif
          severity: CRITICAL,HIGH
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: backend/trivy-results.sarif

  deploy-dev:
    name: Deploy backend to dev
    needs: [test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-ecs
        with:
          aws-region: us-east-1
          deploy-role-arn: ${{ vars.AWS_CONTROL_PLANE_DEPLOY_ROLE_ARN_DEV }}
          ecr-repository: gateway-dev-control-plane
          ecs-cluster: gateway-dev-control-plane-cluster
          ecs-service: gateway-dev-control-plane-service
          task-definition-family: gateway-dev-control-plane
          container-name: control-plane
          working-directory: backend

  portal-build:
    name: Portal build + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - working-directory: portal
        run: npm ci
      # No GATEWAY_API_URL/Cognito vars needed here: every admin page
      # is force-dynamic, so Next.js never attempts to execute them at
      # build time -- confirmed live, the build succeeds with them unset.
      - working-directory: portal
        run: npm run build

  portal-docker:
    name: Portal Docker build + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        working-directory: portal
        run: docker build -t control-plane-portal:ci .

      - name: Run container
        run: |
          docker run -d --name control-plane-portal-ci -p 8080:8080 \
            -e GATEWAY_API_URL=http://localhost:1 \
            control-plane-portal:ci

      - name: Wait for /login
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/login > /dev/null; then
              echo "portal is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "portal did not become healthy in time"
          exit 1

      - name: Container logs (always, for debugging)
        if: always()
        run: docker logs control-plane-portal-ci

      - name: Stop container
        if: always()
        run: docker rm -f control-plane-portal-ci

  deploy-portal-dev:
    name: Deploy portal to dev
    needs: [portal-build, portal-docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-ecs
        with:
          aws-region: us-east-1
          deploy-role-arn: ${{ vars.AWS_PORTAL_DEPLOY_ROLE_ARN_DEV }}
          ecr-repository: gateway-dev-portal
          ecs-cluster: gateway-dev-portal-cluster
          ecs-service: gateway-dev-portal-service
          task-definition-family: gateway-dev-portal
          container-name: portal
          working-directory: portal
